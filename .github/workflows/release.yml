name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-web
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      # Com o "v" (ex.: v0.3.0), igual à tag.
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      # Versão real (semver), calculada a partir dos commits desde a última
      # tag vX.Y.Z — ver release-standards. should_release=false quando não
      # há commit feat/fix/breaking desde a última release (nada a publicar).
      - name: Compute next version
        id: version
        run: |
          set +e
          VERSION=$(bash .github/scripts/next-version.sh)
          STATUS=$?
          set -e
          if [ $STATUS -eq 2 ]; then
            echo "Nenhum commit feat/fix/breaking desde a última tag — pulando release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $STATUS -ne 0 ]; then
            echo "::error::Falha ao calcular a próxima versão (veja o log acima)"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package dist
        if: steps.version.outputs.should_release == 'true'
        run: |
          cd dist
          zip -r ../agenda-clientes-web-dist.zip .

      - name: Create tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: agenda-clientes-web-dist.zip

  # Deploy na VPS (https://agenda.aamora.com.br) — skill deploy-vps. Fica aqui, e não num workflow
  # disparado pela tag, porque tag criada com o GITHUB_TOKEN não dispara outro workflow. A imagem é
  # montada aqui e enviada por SSH com docker save, sem registry. A VPS_SSH_KEY só consegue rodar
  # "app-deploy agenda" no servidor (forced command): não abre shell, não lê arquivos, não mexe em
  # outra app.
  deploy-vps:
    name: Deploy na VPS
    needs: build-test-release
    if: needs.build-test-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Nunca dois deploys ao mesmo tempo, e nunca cancelar um pela metade.
    concurrency:
      group: deploy-vps-agenda
      cancel-in-progress: false
    environment:
      name: vps
      url: https://agenda.aamora.com.br
    env:
      APP: agenda
      TAG: ${{ needs.build-test-release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-test-release.outputs.version }}

      - name: Versão
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # VITE_API_URL é variável do repositório (não secret): entra no bundle e é pública.
      - name: Montar a imagem
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          [ -n "$VITE_API_URL" ] || { echo "::error::variável VITE_API_URL não cadastrada no repositório"; exit 1; }
          docker build -f deploy/vps/Dockerfile \
            --build-arg VERSAO="$VERSION" --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "$APP:$VERSION" .
          docker save "$APP:$VERSION" | gzip > image.tar.gz
          ls -lh image.tar.gz

      # VPS_KNOWN_HOSTS fixa a chave do servidor: sem ela o ssh aceitaria qualquer host que
      # respondesse no IP, e a imagem iria para quem estivesse lá.
      - name: Configurar o SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar a imagem
        run: ssh -o BatchMode=yes "deploy@${{ secrets.VPS_HOST }}" load-image "$VERSION" < image.tar.gz

      # O app-deploy espera o container ficar saudável e volta para a versão anterior se não ficar.
      - name: Subir a versão
        run: ssh -o BatchMode=yes "deploy@${{ secrets.VPS_HOST }}" up "$VERSION"

      # Confere de fora, pelo caminho real (Cloudflare → Nginx → container).
      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 10 -o /dev/null https://agenda.aamora.com.br/health; then echo "ok"; exit 0; fi
            sleep 10
          done
          echo "::error::https://agenda.aamora.com.br/health não respondeu depois do deploy."
          exit 1
