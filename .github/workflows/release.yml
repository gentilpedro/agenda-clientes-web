name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-web
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          cd dist
          zip -r ../agenda-clientes-web-dist.zip .

      - name: Read project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          generate_release_notes: true
          files: agenda-clientes-web-dist.zip
