# agenda — lido pelo app-deploy e pelo app-backup na VPS (cópia em /opt/agenda/deploy.conf).

# Porta em 127.0.0.1 onde o serviço web atende (a mesma do docker-compose.yml e do nginx.conf).
PORT=5102

# Caminho que responde 2xx com o app pronto (spa.conf). O deploy só vale depois dele; se não
# responder em ~60 s, o app-deploy volta para a versão anterior.
HEALTH_PATH=/health

# SPA sem segredos: VITE_API_URL é pública e entra no bundle na hora do build.
SECRETS=""

# Sem banco e sem volumes: nada para o backup diário.
BACKUP_VOLUMES=""
