# agenda — container em 127.0.0.1:5102 (/opt/agenda). Atrás do Cloudflare, com o certificado
# de origem do aamora (*.aamora.com.br). Cópia em /etc/nginx/conf.d/agenda.conf.
server {
    listen 80;
    listen [::]:80;
    server_name agenda.aamora.com.br;
    return 301 https://agenda.aamora.com.br$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agenda.aamora.com.br;
    include snippets/aamora-ssl.conf;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr já é o IP real (CF-Connecting-IP, ver 01-cloudflare-realip.conf).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}
